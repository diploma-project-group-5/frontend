# Статика web за шлюзом Traefik (маршрут /). /idp і /api/v1/* шлюз веде в інші контейнери.
# HSTS і rate limit на /api/v1/public ставить Traefik; тут — заголовки самої сторінки (розділ 11).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Фрагмент (#токен) браузер на сервер не надсилає, але й шлях /c, /t не логуємо зайвий раз
    access_log off;

    # Спільні заголовки безпеки для всіх відповідей
    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

    # Хешовані файли збірки: довгий кеш (токенів у них немає)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: усі інші шляхи (/c, /t, /admin/…, /scheduler/…) → index.html, без кешу
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
