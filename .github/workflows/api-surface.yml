name: API surface

# Знімок API сервісів (src/api/surface.json) має відповідати develop timetable/school/tenant-service:
# тести звіряють з ним клієнт і мок. Падіння тут — сигнал оновити знімок (npm run api:surface)
# і привести мок/клієнт у відповідність. Щотижня — щоб помітити зміни сервісів і без PR у frontend.
on:
  pull_request:
  push:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run api:surface:check
